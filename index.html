<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarMaker Lookup</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101426;color:white}
header{padding:22px;text-align:center;background:#191f39;border-bottom:1px solid #343c60}
.logo{font-size:27px;font-weight:bold;color:#ffbd52}
header p{color:#bdc4df;font-size:13px}
.container{max-width:750px;margin:35px auto;padding:15px}
.card{background:#1b2340;border:1px solid #343d63;border-radius:18px;padding:25px;margin-bottom:20px}
h2{text-align:center;margin-top:0}
input{width:100%;padding:16px;border-radius:10px;border:1px solid #596486;background:#10182f;color:white;font-size:16px;margin:15px 0}
button{width:100%;padding:15px;border:0;border-radius:10px;background:linear-gradient(90deg,#ff8b36,#ffc34e);font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
#status{text-align:center;color:#ffcf72;margin-top:15px}
.profile{display:none;margin-top:22px}
.profile img{width:105px;height:105px;border-radius:50%;object-fit:cover;border:3px solid #ffbd52}
.profile-top{text-align:center}
.profile-top h2{margin-bottom:5px;overflow-wrap:anywhere}
.details{margin-top:20px}
.detail{display:flex;justify-content:space-between;gap:15px;padding:12px 5px;border-bottom:1px solid #394363}
.detail span:first-child{color:#aeb9da}
.detail span:last-child{text-align:right;overflow-wrap:anywhere}
.note{text-align:center;color:#9ca8c9;font-size:12px;margin-top:25px}
</style>
</head>
<body>

<header>
  <div class="logo">⭐ StarMaker Lookup</div>
  <p>Discover public StarMaker profile information</p>
</header>

<div class="container">
  <div class="card">
    <h2>StarMaker ID Lookup</h2>
    <p style="text-align:center;color:#b9c4e2">Enter a StarMaker User ID</p>

    <input id="sid" type="text" inputmode="numeric"
      placeholder="Enter StarMaker User ID">

    <button id="lookupBtn" onclick="lookupUser()">LOOKUP PROFILE</button>
    <div id="status"></div>

    <div class="profile" id="profile">
      <div class="profile-top">
        <img id="avatar" alt="Profile picture">
        <h2 id="username"></h2>
        <div id="userid" style="color:#b9c4e2"></div>
      </div>
      <div class="details" id="details"></div>
    </div>
  </div>

  <div class="card">
    <h2>Room Lookup</h2>
    <p style="text-align:center;color:#b9c4e2">
      Room Lookup will be added in the next step.
    </p>
  </div>

  <div class="note">StarMaker Lookup · Profile information provided by the lookup service</div>
</div>

<script>
const FUNCTION_URL =
"https://qjbknoxpuugnypmyjrst.supabase.co/functions/v1/starmaker-id-lookup";

// Replace this placeholder with your Supabase anon/public key.
const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

async function lookupUser() {
  const sid = document.getElementById("sid").value.trim();
  const status = document.getElementById("status");
  const button = document.getElementById("lookupBtn");
  const profile = document.getElementById("profile");

  profile.style.display = "none";

  if (!/^\d{5,20}$/.test(sid)) {
    status.textContent = "Please enter a valid StarMaker ID.";
    return;
  }

  if (SUPABASE_ANON_KEY.includes("PASTE_YOUR")) {
    status.textContent = "Supabase public key has not been added yet.";
    return;
  }

  button.disabled = true;
  status.textContent = "Searching profile...";

  try {
    const response = await fetch(FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ sid })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Lookup failed.");
    }

    const user = result.data?.data?.user;

    if (!user) {
      throw new Error("No profile information was returned.");
    }

    document.getElementById("avatar").src = user.profile_image || "";
    document.getElementById("username").textContent =
      user.stage_name || user.name || "StarMaker User";
    document.getElementById("userid").textContent = "ID: " + user.sid;

    const fields = [
      ["Gender", user.gender],
      ["User Level", user.user_level],
      ["Account Created", user.created_on],
      ["Last Updated", user.updated_date],
      ["VIP Status", user.is_vip ? "Yes" : "No"],
      ["VIP Level", user.vip_level],
      ["Family", result.data.data.family ? "Available" : "Not Available"],
      ["Achievements", user.achieve_desc]
    ];

    const details = document.getElementById("details");
    details.replaceChildren();

    fields.forEach(([label, value]) => {
      const row = document.createElement("div");
      row.className = "detail";

      const left = document.createElement("span");
      left.textContent = label;

      const right = document.createElement("span");
      right.textContent =
        value === null || value === undefined || value === ""
          ? "N/A"
          : String(value);

      row.append(left, right);
      details.appendChild(row);
    });

    profile.style.display = "block";
    status.textContent = "Profile found successfully!";

  } catch (error) {
    status.textContent = error.message || "Something went wrong.";
  } finally {
    button.disabled = false;
  }
}

document.getElementById("sid").addEventListener("keydown", function(event) {
  if (event.key === "Enter") lookupUser();
});
</script>
</body>
</html>
